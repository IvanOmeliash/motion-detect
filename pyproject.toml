[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-detect"
version = "0.1.0"
description = "Aerial moving-target detection from drone video: classical motion compensation + TinyUNet + SORT, no pre-trained detectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "scipy",
    "tqdm",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
coreml = ["coremltools"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
